name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The system under test is third-party and changes without warning, so most
  # breakages arrive on a day nobody touched this repository. The nightly run
  # is the one that actually catches them.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Declared at job level so steps can branch on whether they are set.
    env:
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}
      # Set repository variable RUN_E2E to "true" on a runner whose egress is
      # not a datacenter IP. See the "Install Chromium" note below.
      RUN_E2E: ${{ vars.RUN_E2E }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's runner is a Node program; see README, "Architecture
      # decisions". Bun drives the commands, Node hosts the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: API tests
        if: env.PRODUCT_HUNT_TOKEN != ''
        run: bun run test:api

      - name: API tests skipped — no token configured
        if: env.PRODUCT_HUNT_TOKEN == ''
        run: |
          echo "::warning title=API suite skipped::PRODUCT_HUNT_TOKEN is not set, so the API tests did not run."
          echo "Add a repository secret named PRODUCT_HUNT_TOKEN to enable them."

      - name: Install Chromium
        if: env.RUN_E2E == 'true'
        run: bun x playwright install --with-deps chromium

      - name: E2E tests
        if: env.RUN_E2E == 'true'
        run: bun run test:e2e

      # Product Hunt's edge returns HTTP 403 to GitHub-hosted runners — not a
      # bot challenge, a hard block on datacenter egress IPs. The suite passes
      # locally and fails here for reasons that have nothing to do with the
      # code, so running it by default would make this build permanently red
      # and meaningless. See docs/findings.md F-14 for the measurement and the
      # options for fixing it properly.
      - name: E2E skipped — Product Hunt blocks datacenter IPs
        if: env.RUN_E2E != 'true'
        run: |
          echo "::warning title=E2E suite skipped::Product Hunt returns HTTP 403 to GitHub-hosted runners (datacenter egress)."
          echo "Run 'bun run test:e2e' locally, or set repository variable RUN_E2E=true on a self-hosted runner."
          echo "See docs/findings.md F-14."

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.RUN_E2E == 'true' }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
