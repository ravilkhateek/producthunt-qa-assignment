name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The system under test is third-party and changes without warning, so most
  # breakages will arrive on a day nobody touched this repository. The nightly
  # run is the one that actually catches them.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Declared at job level so steps can branch on whether it is set. A fork,
    # or a clone without the secret configured, still gets full E2E coverage
    # rather than a red build it cannot fix.
    env:
      PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's runner is a Node program; see README, "Architecture
      # decisions". Bun drives the commands, Node hosts the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: API tests
        if: env.PRODUCT_HUNT_TOKEN != ''
        run: bun run test:api

      - name: API tests skipped — no token configured
        if: env.PRODUCT_HUNT_TOKEN == ''
        run: |
          echo "::warning title=API suite skipped::PRODUCT_HUNT_TOKEN is not set, so the API tests did not run."
          echo "Add a repository secret named PRODUCT_HUNT_TOKEN to enable them."
          echo "Settings -> Secrets and variables -> Actions -> New repository secret"

      - name: E2E tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
