name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The system under test is third-party and changes without warning, so most
  # breakages will arrive on a day nobody touched this repository. The nightly
  # run is the one that actually catches them.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Playwright's runner is a Node program; see README, "Architecture
      # decisions". Bun drives the commands, Node hosts the runner.
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Install Chromium
        run: bun x playwright install --with-deps chromium

      - name: API tests
        run: bun run test:api
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}

      - name: E2E tests
        run: bun run test:e2e
        env:
          PRODUCT_HUNT_TOKEN: ${{ secrets.PRODUCT_HUNT_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
